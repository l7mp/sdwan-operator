name: go: build and vet

on:
  push:
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'doc/**'
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -trimpath -o sdwan-operator .

      - name: Vet
        run: go vet ./...
